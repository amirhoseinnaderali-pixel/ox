[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vepo-llm"
version = "0.1.0"
description = "Verified Execution-guided Program Optimization with Large Language Models"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "PyYAML>=6,<7", "matplotlib>=3.8,<4]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
